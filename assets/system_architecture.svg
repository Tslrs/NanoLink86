<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardFpga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111927"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="cardEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a142e"/>
      <stop offset="100%" stop-color="#0f0b1c"/>
    </linearGradient>
    <linearGradient id="cardWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c231a"/>
      <stop offset="100%" stop-color="#06140f"/>
    </linearGradient>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bc8cff"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="360" fill="#0d1117" rx="14" stroke="#30363d" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="500" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    NanoLink86 · System Architecture
  </text>

  <!-- ================= BLOCK 1: FPGA SoC ================= -->
  <rect x="40" y="75" width="310" height="245" rx="10" fill="url(#cardFpga)" stroke="#388bfd" stroke-width="1.5"/>
  <text x="195" y="108" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    FPGA SoC
  </text>
  <text x="195" y="128" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">
    Tang Nano 9K / Spartan-3A
  </text>

  <!-- Inner items inside FPGA -->
  <rect x="60" y="145" width="270" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="195" y="167" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
    Next186 CPU (80186 PC-Compatible)
  </text>

  <rect x="60" y="188" width="130" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="125" y="209" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">
    RAM (PSRAM/DDR2)
  </text>

  <rect x="200" y="188" width="130" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="265" y="209" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">
    Video (VGA/HDMI)
  </text>

  <rect x="60" y="228" width="130" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="125" y="249" fill="#ffa657" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">
    MicroSD (Drive C:)
  </text>

  <rect x="200" y="228" width="130" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="265" y="249" fill="#ff7b72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">
    8042 Keyboard
  </text>

  <!-- OS Badge -->
  <rect x="60" y="268" width="270" height="36" rx="6" fill="#1f2d24" stroke="#2ea043" stroke-width="1"/>
  <text x="195" y="291" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    FreeDOS 1.3
  </text>

  <!-- ================= BLOCK 2: ESP32 ================= -->
  <rect x="400" y="75" width="240" height="245" rx="10" fill="url(#cardEsp)" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="520" y="108" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    ESP32 Co-Processor
  </text>
  <text x="520" y="128" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">
    NanoLink86 Keyboard Controller
  </text>

  <rect x="420" y="150" width="200" height="65" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1"/>
  <text x="520" y="177" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    PS/2 Bit-Bang Engine
  </text>
  <text x="520" y="199" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
    MicroPython Viper (12.5 kHz)
  </text>

  <rect x="420" y="230" width="200" height="65" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="520" y="257" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Communication Bridge
  </text>
  <text x="520" y="279" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
    Web Serial · BLE · Wi-Fi
  </text>

  <!-- ================= BLOCK 3: WEB CONTROLLER ================= -->
  <rect x="690" y="75" width="270" height="245" rx="10" fill="url(#cardWeb)" stroke="#2ea043" stroke-width="1.5"/>
  <text x="825" y="108" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    Web Controller
  </text>
  <text x="825" y="128" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle">
    Browser User Interface
  </text>

  <rect x="710" y="150" width="230" height="65" rx="6" fill="#161b22" stroke="#2ea043" stroke-width="1"/>
  <text x="825" y="177" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Web Serial &amp; Bluetooth App
  </text>
  <text x="825" y="199" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
    Runs on GitHub Pages (No install)
  </text>

  <rect x="710" y="230" width="230" height="65" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="825" y="257" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Keystrokes &amp; Telemetry
  </text>
  <text x="825" y="279" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
    IBM AT Scancodes + Last.fm
  </text>

  <!-- ================= BUSES & CONNECTIONS ================= -->
  <!-- Web to ESP32 -->
  <line x1="690" y1="195" x2="646" y2="195" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="646" y="175" width="40" height="18" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="666" y="188" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">USB/BLE</text>

  <!-- ESP32 to FPGA -->
  <line x1="400" y1="195" x2="356" y2="195" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-purple)"/>
  <rect x="355" y="175" width="42" height="18" rx="3" fill="#161b22" stroke="#f43f5e" stroke-width="1"/>
  <text x="376" y="188" fill="#ff7b72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PS/2</text>

</svg>
