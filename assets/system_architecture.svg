<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="gClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122a1f"/>
      <stop offset="100%" stop-color="#08150f"/>
    </linearGradient>
    <linearGradient id="gEsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231a3d"/>
      <stop offset="100%" stop-color="#120c22"/>
    </linearGradient>
    <linearGradient id="gFPGA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16253b"/>
      <stop offset="100%" stop-color="#0b1422"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="260" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1.5"/>

  <!-- BOX 1: CLIENT (WEB BROWSER) -->
  <rect x="40" y="50" width="240" height="160" rx="10" fill="url(#gClient)" stroke="#2ea043" stroke-width="2"/>
  <text x="160" y="90" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    Web Controller
  </text>
  <text x="160" y="115" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Browser User Interface
  </text>
  <text x="160" y="145" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    • Web Serial &amp; Web Bluetooth
  </text>
  <text x="160" y="168" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    • Keystrokes &amp; Telemetry
  </text>

  <!-- ARROW 1: Web -> ESP32 -->
  <line x1="280" y1="130" x2="350" y2="130" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="290" y="105" width="50" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="315" y="119" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    USB / BLE
  </text>

  <!-- BOX 2: ESP32 CO-PROCESSOR -->
  <rect x="360" y="50" width="240" height="160" rx="10" fill="url(#gEsp)" stroke="#bc8cff" stroke-width="2"/>
  <text x="480" y="90" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    ESP32 Co-Processor
  </text>
  <text x="480" y="115" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Keyboard Engine
  </text>
  <text x="480" y="145" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    • MicroPython Viper Machine Code
  </text>
  <text x="480" y="168" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    • 12.5 kHz PS/2 Clock &amp; Data
  </text>

  <!-- ARROW 2: ESP32 -> FPGA -->
  <line x1="600" y1="130" x2="670" y2="130" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="612" y="105" width="46" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="635" y="119" fill="#ff7b72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    PS/2
  </text>

  <!-- BOX 3: FPGA SoC -->
  <rect x="680" y="50" width="240" height="160" rx="10" fill="url(#gFPGA)" stroke="#388bfd" stroke-width="2"/>
  <text x="800" y="90" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    FPGA SoC
  </text>
  <text x="800" y="115" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    Tang Nano 9K / Spartan-3A
  </text>
  <text x="800" y="145" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    • Next186 CPU (80186 PC SoC)
  </text>
  <text x="800" y="168" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    • FreeDOS 1.3 (MicroSD Drive C:)
  </text>
</svg>
