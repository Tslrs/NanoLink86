<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="fpgaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="url(#bg)" rx="16" stroke="#30363d" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="600" y="46" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">
    NANOLINK86 SYSTEM ARCHITECTURE
  </text>
  <text x="600" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
    Hardware/Software Co-Design: 16-Bit x86 SoC on Gowin FPGA with ESP32 Xtensa Viper Co-Processor &amp; Web Bridge
  </text>

  <!-- ================= SECTION 1: TANG NANO 9K FPGA ================= -->
  <rect x="40" y="110" width="460" height="490" rx="12" fill="url(#fpgaGrad)" stroke="#388bfd" stroke-width="2"/>
  <rect x="55" y="125" width="430" height="36" rx="6" fill="#1e293b" stroke="#388bfd" stroke-width="1"/>
  <text x="270" y="149" fill="#58a6ff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    TANG NANO 9K (GOWIN GW1NR-9C FPGA)
  </text>

  <!-- CPU Box -->
  <rect x="65" y="180" width="410" height="80" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="80" y="208" fill="#58a6ff" font-family="sans-serif" font-size="16" font-weight="700">Next186 CPU Soft-Core (80186 @ 18 MHz)</text>
  <text x="80" y="230" fill="#c9d1d9" font-family="sans-serif" font-size="12">• 18 MIPS Processing Core (ALU, BIU, Registers, 32-bit Internal Bus)</text>
  <text x="80" y="248" fill="#8b949e" font-family="sans-serif" font-size="11">• 6,992 / 8,640 LUTs (81% FPGA Utilization) · Zero L1 Cache for Fit</text>

  <!-- Memory Box -->
  <rect x="65" y="275" width="195" height="95" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="78" y="300" fill="#79c0ff" font-family="sans-serif" font-size="13" font-weight="700">64 Mbit PSRAM</text>
  <text x="78" y="322" fill="#8b949e" font-family="sans-serif" font-size="11">Embedded Cache Interface</text>
  <text x="78" y="340" fill="#8b949e" font-family="sans-serif" font-size="11">72 MHz 16-bit DDR</text>
  <text x="78" y="358" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="600">86 mW Low Power</text>

  <!-- Video Box -->
  <rect x="280" y="275" width="195" height="95" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="293" y="300" fill="#d2a8ff" font-family="sans-serif" font-size="13" font-weight="700">DVI TX HDMI</text>
  <text x="293" y="322" fill="#8b949e" font-family="sans-serif" font-size="11">640x480 @ 60 Hz VGA</text>
  <text x="293" y="340" fill="#8b949e" font-family="sans-serif" font-size="11">Differential TMDS PHY</text>
  <text x="293" y="358" fill="#d2a8ff" font-family="sans-serif" font-size="11" font-weight="600">Direct Display Out</text>

  <!-- Storage Box -->
  <rect x="65" y="385" width="195" height="95" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="78" y="410" fill="#ffa657" font-family="sans-serif" font-size="13" font-weight="700">SPI MicroSD Controller</text>
  <text x="78" y="432" fill="#8b949e" font-family="sans-serif" font-size="11">Drive C: Emulation (FAT16)</text>
  <text x="78" y="450" fill="#8b949e" font-family="sans-serif" font-size="11">FreeDOS 1.3 Kernel Boot</text>
  <text x="78" y="468" fill="#ffa657" font-family="sans-serif" font-size="11" font-weight="600">INT 13h BIOS Driver</text>

  <!-- Keyboard Controller Box -->
  <rect x="280" y="385" width="195" height="95" rx="8" fill="#0d1117" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="293" y="410" fill="#ff7b72" font-family="sans-serif" font-size="13" font-weight="700">Intel 8042 Controller</text>
  <text x="293" y="432" fill="#8b949e" font-family="sans-serif" font-size="11">Hardware PS/2 Receiver</text>
  <text x="293" y="450" fill="#8b949e" font-family="sans-serif" font-size="11">Pin 18 (CLK) &amp; Pin 19 (DAT)</text>
  <text x="293" y="468" fill="#ff7b72" font-family="sans-serif" font-size="11" font-weight="600">IBM AT Scan Code Set 2</text>

  <!-- Boot ROM Note -->
  <rect x="65" y="495" width="410" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="520" fill="#e6edf3" font-family="sans-serif" font-size="12" font-weight="700">Next186 Chameleon PC BIOS &amp; Bootloader</text>
  <text x="80" y="540" fill="#8b949e" font-family="sans-serif" font-size="11">• Embedded ROM BIOS (BIOS_Next186.asm) handles MBR execution at 0x7C00</text>
  <text x="80" y="558" fill="#8b949e" font-family="sans-serif" font-size="11">• Gowin EDA V1.9.12 verified bitstream: Next186_S.fs (3.55 MB permanently in SPI Flash)</text>

  <!-- ================= SECTION 2: ESP32 CO-PROCESSOR ================= -->
  <rect x="540" y="110" width="320" height="490" rx="12" fill="url(#espGrad)" stroke="#bc8cff" stroke-width="2"/>
  <rect x="555" y="125" width="290" height="36" rx="6" fill="#1e1b4b" stroke="#bc8cff" stroke-width="1"/>
  <text x="700" y="149" fill="#d2a8ff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    ESP32 HARDWARE CO-PROCESSOR
  </text>

  <!-- Viper Bit-Banger -->
  <rect x="555" y="180" width="290" height="125" rx="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="570" y="208" fill="#d2a8ff" font-family="sans-serif" font-size="15" font-weight="700">Xtensa Viper PS/2 Engine</text>
  <text x="570" y="230" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="600">Exact 12.5 kHz PS/2 Clock (40μs Period)</text>
  <text x="570" y="252" fill="#8b949e" font-family="sans-serif" font-size="11">• Native Machine Code (@micropython.viper)</text>
  <text x="570" y="270" fill="#8b949e" font-family="sans-serif" font-size="11">• Direct 32-bit GPIO register writes (0x3FF44008)</text>
  <text x="570" y="288" fill="#8b949e" font-family="sans-serif" font-size="11">• Calibrated loop (delay_cnt=220) - 0 jitter!</text>

  <!-- Multi-Mode Bridge -->
  <rect x="555" y="320" width="290" height="150" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="570" y="348" fill="#7ee787" font-family="sans-serif" font-size="14" font-weight="700">Tri-Mode Communications</text>
  
  <text x="570" y="374" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="600">1. Web Serial API (USB-UART)</text>
  <text x="585" y="392" fill="#8b949e" font-family="sans-serif" font-size="11">115200 baud direct hardware stream</text>

  <text x="570" y="414" fill="#bc8cff" font-family="sans-serif" font-size="12" font-weight="600">2. Bluetooth Low Energy (BLE)</text>
  <text x="585" y="432" fill="#8b949e" font-family="sans-serif" font-size="11">Nordic UART Service (NUS) wireless link</text>

  <text x="570" y="454" fill="#ffa657" font-family="sans-serif" font-size="12" font-weight="600">3. Wi-Fi Telemetry &amp; Captive Portal</text>

  <!-- Power Note -->
  <rect x="555" y="485" width="290" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="570" y="512" fill="#e6edf3" font-family="sans-serif" font-size="12" font-weight="700">Power &amp; Performance</text>
  <text x="570" y="534" fill="#8b949e" font-family="sans-serif" font-size="11">• Current: 80 - 110 mA @ 5V (~0.45 W)</text>
  <text x="570" y="552" fill="#8b949e" font-family="sans-serif" font-size="11">• Total Combined System: &lt; 1.45 Watts</text>
  <text x="570" y="570" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="600">• 100% Fanless &amp; Silent Operation</text>

  <!-- ================= SECTION 3: CLIENT / WEB CONTROLLER ================= -->
  <rect x="900" y="110" width="260" height="490" rx="12" fill="url(#webGrad)" stroke="#2ea043" stroke-width="2"/>
  <rect x="915" y="125" width="230" height="36" rx="6" fill="#064e3b" stroke="#2ea043" stroke-width="1"/>
  <text x="1030" y="149" fill="#7ee787" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    WEB CONTROLLER (CLIENT)
  </text>

  <!-- Zero Install UI -->
  <rect x="915" y="180" width="230" height="145" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.5"/>
  <text x="930" y="208" fill="#7ee787" font-family="sans-serif" font-size="14" font-weight="700">Zero-Install Web App</text>
  <text x="930" y="230" fill="#8b949e" font-family="sans-serif" font-size="11">• Runs on GitHub Pages</text>
  <text x="930" y="248" fill="#8b949e" font-family="sans-serif" font-size="11">• Chrome / Edge / Safari / Bluefy</text>
  <text x="930" y="266" fill="#8b949e" font-family="sans-serif" font-size="11">• Authentic CRT themes</text>
  <text x="930" y="284" fill="#8b949e" font-family="sans-serif" font-size="11">• Real-time typing speed (WPM)</text>
  <text x="930" y="304" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="600">tslrs.github.io/NanoLink86</text>

  <!-- Scancode Engine -->
  <rect x="915" y="340" width="230" height="130" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="930" y="368" fill="#58a6ff" font-family="sans-serif" font-size="13" font-weight="700">Scancode Translation</text>
  <text x="930" y="390" fill="#8b949e" font-family="sans-serif" font-size="11">• JavaScript key event listener</text>
  <text x="930" y="408" fill="#8b949e" font-family="sans-serif" font-size="11">• Generates IBM AT Make/Break</text>
  <text x="930" y="426" fill="#8b949e" font-family="sans-serif" font-size="11">• Handles Shift, Ctrl, Alt, F1-F12</text>
  <text x="930" y="444" fill="#8b949e" font-family="sans-serif" font-size="11">• Direct scan code inject</text>

  <!-- Relay Server -->
  <rect x="915" y="485" width="230" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="930" y="512" fill="#e6edf3" font-family="sans-serif" font-size="12" font-weight="700">macOS launchd Daemon</text>
  <text x="930" y="534" fill="#8b949e" font-family="sans-serif" font-size="11">• WebSocket relay (port 8088)</text>
  <text x="930" y="552" fill="#8b949e" font-family="sans-serif" font-size="11">• TCP bridge (port 8089)</text>
  <text x="930" y="570" fill="#7ee787" font-family="sans-serif" font-size="11" font-weight="600">• Audit history dashboard</text>

  <!-- ================= BUS CONNECTORS / ARROWS ================= -->
  <!-- Wire: ESP32 to Tang Nano (PS/2) -->
  <path d="M 555 240 L 500 240 L 500 432 L 475 432" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,3" filter="url(#glow)"/>
  <polygon points="475,432 485,427 485,437" fill="#f43f5e"/>
  <rect x="480" y="325" width="80" height="36" rx="4" fill="#0d1117" stroke="#f43f5e" stroke-width="1"/>
  <text x="520" y="340" fill="#ff7b72" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PS/2 BUS</text>
  <text x="520" y="353" fill="#ff7b72" font-family="sans-serif" font-size="9" text-anchor="middle">12.5 kHz / 40μs</text>

  <!-- Wire: Web to ESP32 (Serial / BLE) -->
  <path d="M 915 250 L 860 250 L 860 380 L 845 380" fill="none" stroke="#58a6ff" stroke-width="3" filter="url(#glow)"/>
  <polygon points="845,380 855,375 855,385" fill="#58a6ff"/>
  <rect x="842" y="295" width="86" height="36" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
  <text x="885" y="310" fill="#79c0ff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">USB / BLE</text>
  <text x="885" y="323" fill="#79c0ff" font-family="sans-serif" font-size="9" text-anchor="middle">Zero Buffer Lag</text>
</svg>